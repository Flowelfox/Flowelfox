name: Generate Profile Assets
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Flowelfox
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=orange

      - name: Metrics — main stats
        uses: lowlighter/metrics@latest
        with:
          filename: dist/metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: Flowelfox
          output_action: none
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Kyiv
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_repositories_limit: 4
          plugin_lines_sections: base
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Metrics — languages
        uses: lowlighter/metrics@latest
        with:
          filename: dist/metrics.languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: Flowelfox
          output_action: none
          base: ""
          plugin_languages: yes
          plugin_languages_ignored: html, css, scss, dockerfile, makefile, shell
          plugin_languages_details: percentage, bytes-size
          plugin_languages_limit: 8
          plugin_languages_analysis_timeout: 15
          plugin_languages_indepth: yes
          plugin_languages_sections: most-used

      - name: Metrics — featured repositories
        uses: lowlighter/metrics@latest
        with:
          filename: dist/metrics.repos.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: Flowelfox
          output_action: none
          base: ""
          plugin_repositories: yes
          plugin_repositories_featured: Flowelfox/RCFlow, Flowelfox/worktree-manager, Flowelfox/codegraph, Flowelfox/monobank-daily
          plugin_repositories_pinned: 0
          plugin_repositories_starred: 0
          plugin_repositories_random: 0
          plugin_repositories_order: featured

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
